
name: Build Yatse Control APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip Source
        run: |
          unzip -q YatseMediaControl_v3_Source.zip -d source

      - name: Build APK
        working-directory: source/YatseMediaControl_v3_Source
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YatseMediaControl-v3-debug-apk
          path: source/YatseMediaControl_v3_Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
